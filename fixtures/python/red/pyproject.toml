[project]
name = "gates-fixture"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
python_version = "3.12"

[tool.coverage.run]
source = ["src"]

[dependency-groups]
dev = [
    "mypy==1.18.2",
    "pytest==9.0.1",
    "pytest-cov==7.0.0",
    "ruff==0.14.5",
]
