# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_gates
# Analysed by .github/workflows/ci.yml (sonar.yml) on every pull request and on summer; Automatic Analysis is off.
sonar.organization=paxel
sonar.projectKey=paxel_gates
sonar.projectName=gates

# The gate scripts and their tests; the fixtures are projects of their own, with planted
# findings on purpose.
sonar.sources=scripts,actions,.github/workflows
sonar.tests=tests
sonar.exclusions=fixtures/**
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Coverage: python.yml keeps the Cobertura XML of each part here.
sonar.python.coverage.reportPaths=coverage/scripts.xml
