# The strict ruff config of every Python repository of the standard (Q14): pycodestyle,
# pyflakes, isort, bugbear, the bandit security rules and pyupgrade. A repository copies
# the rule selection; the audit checks the rules. No target version here: ruff takes it from
# `requires-python` in pyproject.toml, so pyupgrade never asks for syntax the project's oldest
# Python lacks.
line-length = 110

[lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]

[lint.per-file-ignores]
# Tests assert with assert and write temporary files; that is what they are for.
"tests/**" = ["S101", "S108"]
