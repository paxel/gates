# The strict Dart analysis of the standard (Q14). A Flutter package includes
# package:flutter_lints/flutter.yaml instead of package:lints/recommended.yaml; the rest is the
# same. dart.yml runs `flutter analyze --fatal-infos --fatal-warnings`, so infos fail too.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A missing return or an unused result is a bug, never a style choice.
    missing_return: error
    unused_result: error
