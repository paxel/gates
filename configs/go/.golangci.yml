# The strict Go lint config of the standard (Q14): golangci-lint v2 with gosec, errcheck and
# revive on top of the defaults; gofmt as the formatter. A repository copies this file.
version: "2"

linters:
  default: standard
  enable:
    - gosec
    - errcheck
    - revive
    - govet
    - staticcheck
    - bodyclose
    - errorlint

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
