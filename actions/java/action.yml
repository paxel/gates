name: Java gate
description: Maven verify with Error Prone, SpotBugs and JaCoCo, then the coverage ratchet.
inputs:
  root:
    description: The project's root (where coverage-floors.toml and the pin files are), relative to the workspace.
    default: .
  modules:
    description: One line per Maven project, "<part> <directory>".
    default: java .
runs:
  using: composite
  steps:
    - uses: ./.gates/actions/python-pin

    # .java-version is the only source of the version (Q15).
    - name: Java version
      id: java
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        test -f .java-version || { echo "::error::no .java-version: the JDK must be pinned (Q15)"; exit 1; }
        echo "version=$(tr -d '[:space:]' < .java-version)" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: ${{ steps.java.outputs.version }}
        cache: maven

    - name: Error Prone, SpotBugs, tests, coverage ratchet
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        MODULES: ${{ inputs.modules }}
      run: |
        test -f coverage-floors.toml || { echo "::error::no coverage-floors.toml at the repository root (Q4)"; exit 1; }
        mkdir -p coverage
        set --
        while read -r part dir; do
          [ -z "$part" ] && continue
          echo "::group::$part ($dir)"
          python3 "$GITHUB_WORKSPACE/.gates/scripts/config_check.py" --stack java --dir "$dir" --configs "$GITHUB_WORKSPACE/.gates/configs"
          (cd "$dir" && mvn --batch-mode --no-transfer-progress verify)
          python3 "$GITHUB_WORKSPACE/.gates/scripts/to_lcov.py" jacoco "$dir/target/site/jacoco/jacoco.xml" > "coverage/$part.lcov"
          # SonarQube Cloud reads Java coverage as JaCoCo XML.
          cp "$dir/target/site/jacoco/jacoco.xml" "coverage/$part.jacoco.xml"
          # It refuses Java without the compiled classes (sonar.java.binaries).
          mkdir -p "coverage/$part.classes" "coverage/$part.test-classes"
          cp -r "$dir/target/classes/." "coverage/$part.classes/"
          [ ! -d "$dir/target/test-classes" ] || cp -r "$dir/target/test-classes/." "coverage/$part.test-classes/"
          set -- "$@" --part "$part"
          echo "::endgroup::"
        done <<< "$MODULES"
        python3 "$GITHUB_WORKSPACE/.gates/scripts/coverage_ratchet.py" --floors coverage-floors.toml --check "$@"
