name: Content gate
description: The checks for a repository without app code (Q10) - formulas, scoop manifests, skills or a static site.
inputs:
  kind:
    description: formulas, scoop, skills or site.
    required: true
  root:
    description: The repository's root, relative to the workspace (formulas are tapped from here).
    default: .
  paths:
    description: The directories to check below root, one per line (formulas ignores it).
    default: ""
  tap:
    description: For formulas, the tap's name, e.g. paxel/tap.
    default: ""
runs:
  using: composite
  steps:
    - uses: ./.gates/actions/python-pin

    - name: Known kind
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
      run: |
        case "$KIND" in formulas|scoop|skills|site) ;; *) echo "::error::kind must be formulas, scoop, skills or site"; exit 1 ;; esac

    - name: ${{ inputs.kind }} hold what they must
      if: inputs.kind != 'formulas'
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        KIND: ${{ inputs.kind }}
        PATHS: ${{ inputs.paths }}
      run: |
        set --
        while IFS= read -r dir; do [ -n "$dir" ] && set -- "$@" "$dir"; done <<< "$PATHS"
        [ "$#" -gt 0 ] || { echo "::error::no paths to check"; exit 1; }
        python3 "$GITHUB_WORKSPACE/.gates/scripts/content_check.py" "$KIND" "$@"

    - name: Homebrew
      if: inputs.kind == 'formulas'
      uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

    - name: brew style and brew audit
      if: inputs.kind == 'formulas'
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        TAP: ${{ inputs.tap }}
      run: |
        [ -n "$TAP" ] || { echo "::error::formulas need the tap input"; exit 1; }
        # A tap is a git repository; a fixture below the workspace becomes one here.
        [ -d .git ] || { git init -q && git add -A && git -c user.name=gates -c user.email=gates@localhost commit -qm tap; }
        brew tap --custom-remote "$TAP" "$PWD"
        brew style --display-cop-names "$TAP"
        brew audit --strict --tap="$TAP"
