name: Go gate
description: gofmt, golangci-lint with the strict config, tests and the coverage ratchet for Go modules.
inputs:
  modules:
    description: One line per module, "<part> <directory>", e.g. "go .".
    default: go .
runs:
  using: composite
  steps:
    - uses: ./.gates/actions/python-pin

    - name: Every module carries the strict config and the toolchain pin
      shell: bash
      env:
        MODULES: ${{ inputs.modules }}
      run: |
        set --
        while read -r _ dir; do [ -n "$dir" ] && set -- "$@" --dir "$dir"; done <<< "$MODULES"
        python3 .gates/scripts/config_check.py --stack go --configs .gates/configs "$@"

    - name: First module
      id: first
      shell: bash
      env:
        MODULES: ${{ inputs.modules }}
      run: echo "dir=$(head -n1 <<< "$MODULES" | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # go.mod's toolchain line is the only source of the version (Q15).
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ steps.first.outputs.dir }}/go.mod

    - name: gofmt, golangci-lint, tests, coverage ratchet
      shell: bash
      env:
        MODULES: ${{ inputs.modules }}
      run: |
        test -f coverage-floors.toml || { echo "::error::no coverage-floors.toml at the repository root (Q4)"; exit 1; }
        go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
        mkdir -p coverage
        set --
        while read -r part dir; do
          [ -z "$part" ] && continue
          echo "::group::$part ($dir)"
          unformatted=$(cd "$dir" && gofmt -l .)
          [ -z "$unformatted" ] || { echo "::error::not gofmt-formatted: $unformatted"; exit 1; }
          (cd "$dir" && "$(go env GOPATH)/bin/golangci-lint" run ./...)
          (cd "$dir" && go test -race -coverprofile="$GITHUB_WORKSPACE/coverage/$part.out" ./...)
          python3 .gates/scripts/to_lcov.py go "coverage/$part.out" > "coverage/$part.lcov"
          set -- "$@" --part "$part"
          echo "::endgroup::"
        done <<< "$MODULES"
        python3 .gates/scripts/coverage_ratchet.py --floors coverage-floors.toml --check "$@"
