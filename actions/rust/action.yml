name: Rust gate
description: fmt, the lint set, clippy -D warnings, tests and the coverage ratchet for one Rust workspace.
inputs:
  root:
    description: The project's root (Cargo.toml, rust-toolchain.toml, coverage-floors.toml), relative to the workspace.
    default: .
  apt-packages:
    description: Extra Debian packages the build needs (space separated).
    default: ""
  test-wrapper:
    description: A command the tests run under, e.g. "xvfb-run -a"; empty runs them as they are.
    default: ""
  features:
    description: Cargo feature flags for clippy and the tests.
    default: --all-features
  coverage:
    description: >-
      One line per measured part: the part's name in coverage-floors.toml, then the
      cargo tarpaulin arguments, e.g. "rust --workspace". Empty measures nothing; a repository
      without coverage-floors.toml fails, as the standard asks for one.
    default: rust --workspace
runs:
  using: composite
  steps:
    - uses: ./.gates/actions/python-pin

    # rust-toolchain.toml is the only source of the version (Q15); rustup installs it.
    - name: Toolchain from rust-toolchain.toml
      shell: bash
      working-directory: ${{ inputs.root }}
      run: |
        test -f rust-toolchain.toml || { echo "::error::no rust-toolchain.toml: the toolchain must be pinned (Q15)"; exit 1; }
        rustup toolchain install
        rustc --version

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.root }}

    - name: Extra system packages
      if: inputs.apt-packages != ''
      shell: bash
      env:
        PACKAGES: ${{ inputs.apt-packages }}
      run: |
        sudo apt-get update
        # shellcheck disable=SC2086
        sudo apt-get install -y --no-install-recommends $PACKAGES

    - name: Every crate carries the lint set
      shell: bash
      run: python3 .gates/scripts/rust_lints.py --root "${{ inputs.root }}" --lints .gates/configs/rust/lints.toml

    - name: Formatting
      shell: bash
      working-directory: ${{ inputs.root }}
      run: cargo fmt --all -- --check

    - name: Clippy on shipped code
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        FEATURES: ${{ inputs.features }}
      # shellcheck disable=SC2086
      run: cargo clippy --locked --lib --bins --examples $FEATURES -- -D warnings

    # Tests may unwrap, index and panic: that is how they fail. The rest of the set stays.
    - name: Clippy on tests
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        FEATURES: ${{ inputs.features }}
      # shellcheck disable=SC2086
      run: >-
        cargo clippy --locked --tests --benches $FEATURES -- -D warnings
        -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic -A clippy::indexing_slicing
        -A clippy::string_slice -A clippy::arithmetic_side_effects -A clippy::unreachable

    - name: Tests
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        FEATURES: ${{ inputs.features }}
        WRAPPER: ${{ inputs.test-wrapper }}
      # shellcheck disable=SC2086
      run: $WRAPPER cargo test --locked $FEATURES

    - name: Install cargo-tarpaulin
      if: inputs.coverage != ''
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
      with:
        tool: cargo-tarpaulin

    - name: Coverage ratchet
      if: inputs.coverage != ''
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        PARTS: ${{ inputs.coverage }}
        FEATURES: ${{ inputs.features }}
        WRAPPER: ${{ inputs.test-wrapper }}
        RATCHET: ${{ github.workspace }}/.gates/scripts/coverage_ratchet.py
      run: |
        test -f coverage-floors.toml || { echo "::error::no coverage-floors.toml at the repository root (Q4)"; exit 1; }
        mkdir -p coverage
        set --
        while read -r name args; do
          [ -z "$name" ] && continue
          # shellcheck disable=SC2086
          $WRAPPER cargo tarpaulin --engine llvm --locked $FEATURES $args --skip-clean \
            --out Lcov --output-dir "$RUNNER_TEMP/tarpaulin-$name"
          mv "$RUNNER_TEMP/tarpaulin-$name/lcov.info" "coverage/$name.lcov"
          set -- "$@" --part "$name"
        done <<< "$PARTS"
        python3 "$RATCHET" --floors coverage-floors.toml --check "$@"
