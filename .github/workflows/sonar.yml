name: SonarQube Cloud

# Shared workflow: the SonarQube Cloud scan with the coverage the stack workflows measured.
# The caller runs it after its stack jobs (needs:), which upload `coverage-<stack>`
# artifacts into coverage/; sonar-project.properties points at those files
# (coverage/<part>.lcov for Rust, Dart and TS, coverage/<part>.xml for Python,
# coverage/<part>.jacoco.xml for Java, coverage/<part>.out for Go). Callers pin it:
#   uses: paxel/gates/.github/workflows/sonar.yml@<sha> # vX.Y.Z
#   secrets: { sonar-token: "${{ secrets.SQ_TOKEN }}" }
# SonarQube Cloud's quality gate looks at new code only. After the scan the job therefore reads
# every open issue and every hotspot to review, of the branch or of the pull request and its
# target branch, and fails on each one that code-scanning-ignores.toml does not accept.
on:
  workflow_call:
    inputs:
      ignores:
        description: The accepted findings file.
        type: string
        default: code-scanning-ignores.toml
    secrets:
      sonar-token:
        required: true

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarQube Cloud blames new code from the history.
          fetch-depth: 0
          persist-credentials: false
      - name: The project is configured
        run: test -f sonar-project.properties || { echo "::error::no sonar-project.properties"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
        with:
          # The run fails when the quality gate does.
          args: >-
            -Dsonar.qualitygate.wait=true

      # gates comes after the scan, so SonarQube Cloud never analyses its files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gates
          persist-credentials: false
      - uses: ./.gates/actions/python-pin
      - name: No open SonarQube Cloud finding that is not accepted
        env:
          SONAR_TOKEN: ${{ secrets.sonar-token }}
          IGNORES: ${{ inputs.ignores }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          # A pull request is measured on what it adds and on what its target branch has.
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          test -f "$IGNORES" || { echo "::error::no $IGNORES: every repository accepts its findings there"; exit 1; }
          set -- --branch "$BRANCH"
          [ -n "$PULL_REQUEST" ] && set -- "$@" --pull-request "$PULL_REQUEST"
          python3 .gates/scripts/sonar_fetch.py "$@" > "$RUNNER_TEMP/sonar.jsonl"
          python3 .gates/scripts/alerts_gate.py --sonar "$RUNNER_TEMP/sonar.jsonl" --ignores "$IGNORES"
