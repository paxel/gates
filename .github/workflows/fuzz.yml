name: Fuzz

# Shared workflow: the caller's fuzz targets, each for a fixed time, on a schedule. Callers
# pin it from their own fuzz.yml (schedule plus workflow_dispatch):
#   uses: paxel/gates/.github/workflows/fuzz.yml@<sha> # vX.Y.Z
#   with: { stack: rust, targets: "parse_clock\nstore_load" }
#
# rust-dev builds the Rust targets unoptimised, for a crate whose optimised sanitizer build
# does not fit the runner's memory. A Rust target with saved crashes in
# fuzz/regressions/<target> gets them replayed first: a fixed crash that comes back fails at
# once. prepare is a command run in the caller's tree once the dependencies are installed,
# before fuzzing, e.g. "npm run build".
#
# targets, one per line:
#   rust    cargo-fuzz target names in fuzz/
#   go      "<package dir> <FuzzFunc>"
#   python  Atheris scripts (run with uv)
#   ts      Jazzer.js target files
#   java    JUnit @FuzzTest classes (Jazzer through Maven)
#   dart    Dart scripts, run as `dart run <target> <seconds>`: exit 0 means no failure,
#           anything else fails the job. A target writes the input that failed to
#           fuzz/artifacts/<script name without .dart>/crash-<sha256>. Dart has no
#           coverage-guided fuzzer like libFuzzer; the target brings its own (a mutation
#           loop, a package), so expect less depth than the other stacks. The SDK is the one
#           of the Flutter version in .fvmrc; nothing is replayed before fuzzing.
# The same file is gates' own weekly fuzz run on its Atheris targets.
on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      stack:
        type: string
        required: true
      targets:
        type: string
        required: true
      seconds:
        description: Time per target.
        type: number
        default: 300
      apt-packages:
        type: string
        default: ""
      rust-dev:
        description: Build the Rust targets unoptimised (cargo fuzz --dev).
        type: boolean
        default: false
      prepare:
        description: A command run after the dependencies are installed and before fuzzing.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  targets:
    name: Targets
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          # gates' own run (no inputs) fuzzes its scripts.
          [ -n "$TARGETS" ] || TARGETS=$(printf '%s\n' fuzz/fuzz_to_lcov.py fuzz/fuzz_ratchet.py)
          export TARGETS
          list=$(python3 -c 'import json, os; print(json.dumps([t.strip() for t in os.environ["TARGETS"].splitlines() if t.strip()]))')
          [ "$list" != "[]" ] || { echo "::error::no fuzz target: a fuzz run must not pass with nothing fuzzed"; exit 1; }
          echo "list=$list" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Extra system packages
        if: inputs.apt-packages != ''
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PACKAGES

      # Rust: the pinned stable toolchain with RUSTC_BOOTSTRAP for -Z sanitizer, so fuzzing
      # builds with the same compiler as everything else.
      - name: cargo-fuzz
        if: inputs.stack == 'rust'
        env:
          RUSTC_BOOTSTRAP: "1"
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ inputs.seconds || 300 }}
          DEV: ${{ inputs.rust-dev }}
          PREPARE: ${{ inputs.prepare }}
        run: |
          rustup toolchain install
          cargo install cargo-fuzz --locked --version 0.13.2
          [ -z "$PREPARE" ] || bash -c "$PREPARE"
          set --
          [ "$DEV" != "true" ] || set -- --dev
          if [ -d "fuzz/regressions/$TARGET" ]; then
            cargo fuzz run "$@" "$TARGET" "fuzz/regressions/$TARGET" -- -runs=0
          fi
          cargo fuzz run "$@" "$TARGET" -- -max_total_time="$SECONDS_EACH"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.stack == 'go'
        with:
          go-version-file: go.mod
      - name: go test -fuzz
        if: inputs.stack == 'go'
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ inputs.seconds || 300 }}
          PREPARE: ${{ inputs.prepare }}
        run: |
          [ -z "$PREPARE" ] || bash -c "$PREPARE"
          read -r dir func <<< "$TARGET"
          (cd "$dir" && go test -run='^$' -fuzz="^${func}\$" -fuzztime="${SECONDS_EACH}s" .)

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: (inputs.stack || 'python') == 'python'
      - name: Atheris
        if: (inputs.stack || 'python') == 'python'
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ inputs.seconds || 300 }}
          PREPARE: ${{ inputs.prepare }}
        run: |
          # No dependency is built from source; only the project itself, see actions/python.
          name=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["name"])')
          uv sync --locked --no-build --no-binary-package "$name" --all-extras --dev
          [ -z "$PREPARE" ] || bash -c "$PREPARE"
          uv run --locked --no-build --no-binary-package "$name" python "$TARGET" -max_total_time="$SECONDS_EACH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.stack == 'ts'
        with:
          node-version-file: .nvmrc
      - name: Jazzer.js
        if: inputs.stack == 'ts'
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ inputs.seconds || 300 }}
          PREPARE: ${{ inputs.prepare }}
        run: |
          npm ci --ignore-scripts
          [ -z "$PREPARE" ] || bash -c "$PREPARE"
          npx --no-install jazzer "$TARGET" -- -max_total_time="$SECONDS_EACH"

      - name: Java version
        if: inputs.stack == 'java'
        id: java
        run: echo "version=$(tr -d '[:space:]' < .java-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: inputs.stack == 'java'
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
          cache: maven
      - name: Jazzer
        if: inputs.stack == 'java'
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ inputs.seconds || 300 }}
          JAZZER_FUZZ: "1"
          PREPARE: ${{ inputs.prepare }}
        run: |
          [ -z "$PREPARE" ] || bash -c "$PREPARE"
          mvn --batch-mode --no-transfer-progress test -Dtest="$TARGET" -Djazzer.max_duration="${SECONDS_EACH}s"

      # Dart: the SDK of the Flutter version in .fvmrc, the only pin (Q15), as in actions/dart.
      - name: Dart from .fvmrc
        if: inputs.stack == 'dart'
        run: |
          test -f .fvmrc || { echo "::error::no .fvmrc: the Flutter version must be pinned (Q15)"; exit 1; }
          version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')
          git clone --quiet --depth 1 --branch "$version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: dart run
        if: inputs.stack == 'dart'
        env:
          TARGET: ${{ matrix.target }}
          SECONDS_EACH: ${{ inputs.seconds || 300 }}
          PREPARE: ${{ inputs.prepare }}
        run: |
          flutter pub get --enforce-lockfile
          [ -z "$PREPARE" ] || bash -c "$PREPARE"
          dart run "$TARGET" "$SECONDS_EACH"

      - name: Unknown stack
        if: ${{ !contains(fromJSON('["rust","go","python","ts","java","dart"]'), inputs.stack || 'python') }}
        run: |
          echo "::error::stack must be rust, go, python, ts, java or dart"
          exit 1

      - name: Keep the crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ strategy.job-index }}
          path: |
            fuzz/artifacts/
            **/testdata/fuzz/
            crash-*
          if-no-files-found: ignore
