name: CI

# gates' own gates, through its own shared workflows (Q17): the OSV gate, the Python gate on
# the scripts, actionlint on every workflow and template, and SonarQube Cloud. The self-test of
# every gate on its fixtures is selftest.yml.
# A branch gets its run through its pull request; a run per push as well would be the same
# jobs twice, and SonarQube Cloud analyses only the default branch and pull requests.
on:
  push:
    branches: [summer]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vulns:
    uses: ./.github/workflows/vulns.yml
    with:
      exclude: fixtures

  python:
    uses: ./.github/workflows/python.yml
    with:
      packages: scripts .

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint 1.7.12, checked against its release checksum
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: Workflows
        run: ./actionlint
      - name: Templates (their gates pins are placeholders)
        run: ./actionlint -ignore 'GATES_SHA' templates/workflows/*.yml

  sonar:
    needs: python
    uses: ./.github/workflows/sonar.yml
    secrets:
      sonar-token: ${{ secrets.SQ_TOKEN }}
