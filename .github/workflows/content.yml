name: Content

# Shared workflow: the checks for a repository without app code (Q10). Callers pin it:
#   uses: paxel/gates/.github/workflows/content.yml@<sha> # vX.Y.Z
on:
  workflow_call:
    inputs:
      kind:
        description: formulas, scoop, skills or site.
        type: string
        required: true
      root:
        description: The repository's root, relative to the workspace.
        type: string
        default: .
      paths:
        description: The directories to check below root, one per line (formulas ignores it).
        type: string
        default: ""
      tap:
        description: For formulas, the tap's name, e.g. paxel/tap.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  content:
    name: ${{ inputs.kind }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gates
          persist-credentials: false
      - uses: ./.gates/actions/content
        with:
          kind: ${{ inputs.kind }}
          root: ${{ inputs.root }}
          paths: ${{ inputs.paths }}
          tap: ${{ inputs.tap }}
