name: Dart

# Shared workflow: the Dart and Flutter gate. Callers pin it:
#   uses: paxel/gates/.github/workflows/dart.yml@<sha> # vX.Y.Z
on:
  workflow_call:
    inputs:
      packages:
        description: One line per package, "<part> <directory>"; see actions/dart.
        type: string
        default: dart .
      apt-packages:
        type: string
        default: ""
      test-wrapper:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  dart:
    name: format, analyze, test, coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gates
          persist-credentials: false
      - uses: ./.gates/actions/dart
        with:
          packages: ${{ inputs.packages }}
          apt-packages: ${{ inputs.apt-packages }}
          test-wrapper: ${{ inputs.test-wrapper }}
      - name: Keep the coverage for SonarQube Cloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-dart
          path: coverage/
          if-no-files-found: error
