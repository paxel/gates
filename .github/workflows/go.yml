name: Go

# Shared workflow: the Go gate. Callers pin it:
#   uses: paxel/gates/.github/workflows/go.yml@<sha> # vX.Y.Z
on:
  workflow_call:
    inputs:
      root:
        description: The project's root, relative to the repository.
        type: string
        default: .
      modules:
        description: One line per module, "<part> <directory>".
        type: string
        default: go .
      cross:
        description: Further systems every module is built and vetted for, one "GOOS/GOARCH" per line.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  go:
    name: gofmt, golangci-lint, test, coverage
    runs-on: ubuntu-24.04
    steps:
      # The caller goes to src/ and gates beside it to .gates, so no tool that walks the
      # caller's tree ever sees gates' own files or its fixtures.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gates
          persist-credentials: false
      - uses: ./.gates/actions/go
        with:
          root: ${{ inputs.root == '.' && 'src' || format('src/{0}', inputs.root) }}
          modules: ${{ inputs.modules }}
          cross: ${{ inputs.cross }}
      - name: Keep the coverage for SonarQube Cloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: ${{ inputs.root == '.' && 'src' || format('src/{0}', inputs.root) }}/coverage/
          if-no-files-found: error
