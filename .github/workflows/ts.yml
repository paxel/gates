name: TypeScript

# Shared workflow: the TypeScript gate. Callers pin it:
#   uses: paxel/gates/.github/workflows/ts.yml@<sha> # vX.Y.Z
on:
  workflow_call:
    inputs:
      root:
        description: The project's root, relative to the repository.
        type: string
        default: .
      packages:
        description: One line per package, "<part> <directory>"; see actions/ts.
        type: string
        default: ts .

permissions:
  contents: read

jobs:
  ts:
    name: prettier, eslint, tsc, test, coverage
    runs-on: ubuntu-24.04
    steps:
      # The caller goes to src/ and gates beside it to .gates, so no tool that walks the
      # caller's tree ever sees gates' own files or its fixtures.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gates
          persist-credentials: false
      - uses: ./.gates/actions/ts
        with:
          root: src/${{ inputs.root }}
          packages: ${{ inputs.packages }}
      - name: Keep the coverage for SonarQube Cloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-ts
          path: src/${{ inputs.root }}/coverage/
          if-no-files-found: error
