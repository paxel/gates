# Dependency updates: one grouped pull request per week. A release is proposed only after it
# has been out for 14 days (cooldown), so early fixes are in; security updates are not held
# back. Every action is pinned to a full commit SHA with its version in a comment; Dependabot
# moves the SHA and the comment together. The scripts use the standard library only, so
# github-actions is the only ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      githubactions:
        patterns: ["*"]
    ignore:
      # The Rust toolchain pin moves with rust-toolchain.toml, never by a weekly update.
      - dependency-name: dtolnay/rust-toolchain
