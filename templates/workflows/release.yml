name: Release

# A release: the gate first, then the repository's own build jobs, then provenance, then the
# GitHub release with every file. The build jobs are the repository's; each uploads its files
# as an artifact named dist-<something>. A registry package (crate, jar, npm tarball, wheel) is
# one of those files too (Q8); npm and PyPI publishing adds their own provenance.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  gate:
    needs: version
    uses: paxel/gates/.github/workflows/release-gate.yml@GATES_SHA # GATES_VERSION
    permissions:
      contents: read
      security-events: read
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      alerts-token: ${{ secrets.GATES_ALERTS_TOKEN }}

  build:
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the release files
        run: echo "the repository's own build; write the files to dist/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: dist/

  provenance:
    needs: build
    uses: paxel/gates/.github/workflows/provenance.yml@GATES_SHA # GATES_VERSION
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      name: REPO_NAME
      tag: ${{ github.ref_name }}
      artifacts: dist-*

  publish:
    needs: [version, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Release notes from the CHANGELOG section
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          files: dist/*

  # A Dart package only; delete pub-version and pub-dev in every other repository. pub.dev
  # keeps a version for good, so they run last, once the GitHub release is out. pub-version
  # asks pub.dev for the tag's version: a version already there (the first one, published by
  # hand) skips the publish, a missing one is published, any other answer fails the release.
  pub-version:
    needs: publish
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.ask.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ask
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name=$(sed -n 's/^name:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d "\"' \r")
          [ -n "$name" ] || { echo "::error::no name in pubspec.yaml"; exit 1; }
          version="${TAG#v}"
          code=$(curl --proto '=https' --tlsv1.2 -s -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 2 \
            "https://pub.dev/api/packages/$name/versions/$version")
          case "$code" in
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            200)
              echo "::notice::$name $version is already on pub.dev; nothing to publish"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::pub.dev answered $code for $name $version"; exit 1 ;;
          esac

  # It publishes through OIDC, which pub.dev accepts only for a tag push matching the
  # package's tag pattern (v{{version}}).
  pub-dev:
    needs: pub-version
    if: needs.pub-version.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
