# Accepted findings. The release and the weekly Security run (paxel/gates release-gate.yml)
# fail on every open code-scanning alert, of any tool and severity, and every open
# secret-scanning alert that is not listed here. Each entry says why the finding stays and
# when the gate fails again: that is the review. Then fix it, or move the date with a reason.
# Nothing is dismissed in GitHub.
#
# [[IgnoredAlerts]]   tool, rule (as GitHub reports them), path, reason, ignoreUntil
#                     path is the file the finding is in; the entry covers that file only.
#                     Leave it out only for a finding without a file (Scorecard's
#                     repository-level ones); left out for a finding in a file, it blocks.
# [[IgnoredSecrets]]  secret_type, reason, ignoreUntil

[[IgnoredAlerts]]
tool = "Scorecard"
rule = "CodeReviewID"
ignoreUntil = REVIEW_DATE
reason = """Single maintainer: GitHub forbids approving one's own pull request, so no merge \
can carry a second person's approval. Every change goes through a pull request with green CI."""

[[IgnoredAlerts]]
tool = "Scorecard"
rule = "CIIBestPracticesID"
ignoreUntil = REVIEW_DATE
reason = """Single maintainer: the OpenSSF Best Practices badge is a self-certification \
questionnaire; the practices it asks for are checked by the gates themselves."""

[[IgnoredAlerts]]
tool = "Scorecard"
rule = "BranchProtectionID"
ignoreUntil = REVIEW_DATE
reason = """Single maintainer: the ruleset blocks deletion and force-pushes and requires a \
pull request with green CI, but no approval, since nobody else can give one. Scorecard scores \
the missing approvers and stale-review dismissal, so it stays below maximal."""
